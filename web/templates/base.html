<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibrePKI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="fas fa-lock me-2"></i>LibrePKI
            </a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('index') }}"><i class="fas fa-home me-1"></i>Accueil</a>
                <a class="nav-link" href="{{ url_for('list_certs') }}"><i class="fas fa-certificate me-1"></i>Certificats</a>
                <a class="nav-link" href="{{ url_for('generate_cert') }}"><i class="fas fa-plus-circle me-1"></i>Générer</a>
                <a class="nav-link" href="{{ url_for('upload_cert') }}"><i class="fas fa-upload me-1"></i>Uploader</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
